[project]
name = "ecom-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Faker>=40.40.0",
    "pandas>=3.0.6",
    "faker-ecommerce-provider>=1.2.0",
    "kafka-python>=3.0.11",
    "psycopg[binary]>=3.3.6",
    "streamlit>=1.65.0",
    "python-dotenv>=1.2.4",
    "psycopg-pool>=3.3.3",
    "tenacity>=9.2.1",
    "streamlit-autorefresh>=1.0.1"
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "ruff>=0.16.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecom_pipeline"]

[project.scripts]
ecom-pipeline = "ecom_pipeline.__main__:main"
producer = "ecom_pipeline.producer:run_all_producers"
aggregator = "ecom_pipeline.aggregator:consume_all_streams"
alerts = "ecom_pipeline.aggregator:produce_alert_stream_cli"
dashboard = "ecom_pipeline.dashboard:main"
